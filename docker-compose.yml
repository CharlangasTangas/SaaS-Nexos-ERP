name: nexos-dev

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexos
      POSTGRES_PASSWORD: nexos
      POSTGRES_DB: nexos
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexos -d nexos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # MinIO (S3-compatible storage)
  # ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # MinIO Init — crea el bucket y configura CORS
  # ─────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: nexos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/nexos-files;
        mc anonymous set download local/nexos-files/public;
        echo 'MinIO bucket nexos-files listo';
        exit 0;
      "
    networks:
      - nexos_net
    restart: "no"

  # ─────────────────────────────────────────────────────────
  # Mailhog — captura de emails SMTP (solo dev)
  # ─────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexos-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # API — NestJS 10
  # ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: nexos-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - api_logs:/var/log/nexos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────
  # Web — Next.js 14
  # ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: nexos-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexos_net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────
  # Caddy — Reverse proxy para *.lvh.me
  # ─────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: nexos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - nexos_net

# ─────────────────────────────────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: nexos_postgres_data
  redis_data:
    name: nexos_redis_data
  minio_data:
    name: nexos_minio_data
  api_logs:
    name: nexos_api_logs
  caddy_data:
    name: nexos_caddy_data
  caddy_config:
    name: nexos_caddy_config

# ─────────────────────────────────────────────────────────
# Red interna
# ─────────────────────────────────────────────────────────
networks:
  nexos_net:
    name: nexos_network
    driver: bridge
